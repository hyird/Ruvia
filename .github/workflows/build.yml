name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "vcpkg.json"
      - "ruvia-core/**"
      - "ruvia-http/**"
      - "ruvia-web/**"
      - "examples/**"
      - "tests/**"
      - "scripts/**"
      - "README.md"
      - "AGENTS.md"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "vcpkg.json"
      - "ruvia-core/**"
      - "ruvia-http/**"
      - "ruvia-web/**"
      - "examples/**"
      - "tests/**"
      - "scripts/**"
      - "README.md"
      - "AGENTS.md"
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu_build:
    name: Ubuntu build
    runs-on: ubuntu-24.04
    env:
      CC: gcc-13
      CXX: g++-13
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      BUILD_TYPE: Debug
    steps:
      - name: Checkout ruvia
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 ninja-build curl zip unzip tar
          gcc-13 --version
          g++-13 --version

      - name: Cache vcpkg
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.VCPKG_ROOT }}
            ~/.cache/vcpkg/archives
            ${{ github.workspace }}/build/test/vcpkg_installed
          key: vcpkg-build-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'triplets/**', 'CMakeLists.txt') }}
          restore-keys: |
            vcpkg-build-${{ runner.os }}-

      - name: Bootstrap vcpkg
        run: |
          set -euo pipefail
          if [ ! -d "$VCPKG_ROOT/.git" ]; then
            git clone --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          else
            git -C "$VCPKG_ROOT" fetch --depth 1 origin master
            git -C "$VCPKG_ROOT" reset --hard origin/master
          fi
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure
        run: |
          cmake -S . -B build/test -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DRUVIA_ENABLE_MARIADB=ON \
            -DRUVIA_ENABLE_REDIS=ON \
            -DRUVIA_ENABLE_JWT=ON \
            -DRUVIA_BUILD_EXAMPLES=ON \
            -DRUVIA_BUILD_TESTS=ON \
            -DRUVIA_ENABLE_HTTP2_CONFORMANCE_TESTS=ON \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build/test --config "$BUILD_TYPE"

      - name: Test
        run: ctest --test-dir build/test --output-on-failure --build-config "$BUILD_TYPE"

      - name: Configure HTTP hot-path benchmarks
        run: |
          cmake -S . -B build/benchmarks -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DRUVIA_BUILD_CORE=OFF \
            -DRUVIA_BUILD_HTTP=ON \
            -DRUVIA_BUILD_WEB=OFF \
            -DRUVIA_BUILD_BENCHMARKS=ON \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Record HTTP hot-path benchmarks
        run: |
          cmake --build build/benchmarks --target ruvia_benchmarks
          build/benchmarks/tests/benchmarks/ruvia_benchmark_http_hot_paths \
            --warmup-ms 50 \
            --duration-ms 250 \
            --output build/benchmarks/http-hot-paths.json

      - name: Upload HTTP hot-path benchmark record
        uses: actions/upload-artifact@v4
        with:
          name: http-hot-paths-${{ github.sha }}
          path: build/benchmarks/http-hot-paths.json
          retention-days: 30

      - name: Verify component-only builds
        run: |
          cmake -S . -B build/core-only -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DRUVIA_BUILD_CORE=ON \
            -DRUVIA_BUILD_HTTP=OFF \
            -DRUVIA_BUILD_WEB=OFF \
            -DRUVIA_BUILD_TESTS=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_ZLIB=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_unofficial-brotli=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_zstd=ON \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build build/core-only --config "$BUILD_TYPE"
          ctest --test-dir build/core-only --output-on-failure --build-config "$BUILD_TYPE"

          cmake -S . -B build/http-only -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DRUVIA_BUILD_CORE=OFF \
            -DRUVIA_BUILD_HTTP=ON \
            -DRUVIA_BUILD_WEB=OFF \
            -DRUVIA_BUILD_TESTS=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_asio=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_mimalloc=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL=ON \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build build/http-only --config "$BUILD_TYPE"
          ctest --test-dir build/http-only --output-on-failure --build-config "$BUILD_TYPE"

  ubuntu_protocol_sanitizers:
    name: Ubuntu protocol ASan + UBSan + fuzz
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      BUILD_TYPE: Debug
    steps:
      - name: Checkout ruvia
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 ninja-build curl zip unzip tar
          clang++-18 --version

      - name: Cache vcpkg
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.VCPKG_ROOT }}
            ~/.cache/vcpkg/archives
            ${{ github.workspace }}/build/protocol-sanitizers/vcpkg_installed
          key: vcpkg-protocol-sanitizers-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'triplets/**', 'CMakeLists.txt') }}
          restore-keys: |
            vcpkg-protocol-sanitizers-${{ runner.os }}-

      - name: Bootstrap vcpkg
        run: |
          set -euo pipefail
          if [ ! -d "$VCPKG_ROOT/.git" ]; then
            git clone --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          else
            git -C "$VCPKG_ROOT" fetch --depth 1 origin master
            git -C "$VCPKG_ROOT" reset --hard origin/master
          fi
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      # ASan+UBSan cover the complete test executable and protocol library, and
      # -- critically -- the libFuzzer targets, which also link
      # fuzzer,address,undefined. Fuzzing without AddressSanitizer is blind to the
      # heap-buffer-overflow / use-after-free class it is best at finding, so the
      # whole tree is address-instrumented here (the build auto-disables the
      # mimalloc override under any sanitizer). The gcc RelWithDebInfo
      # ubuntu_address_sanitizer job stays as complementary cross-compiler
      # coverage.
      - name: Configure
        run: |
          cmake -S . -B build/protocol-sanitizers -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer" \
            -DRUVIA_BUILD_TESTS=ON \
            -DRUVIA_BUILD_FUZZERS=ON \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build/protocol-sanitizers --config "$BUILD_TYPE"

      - name: Test (unit, ASan + UBSan)
        env:
          ASAN_OPTIONS: halt_on_error=1:abort_on_error=1:detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build/protocol-sanitizers --output-on-failure --build-config "$BUILD_TYPE"

      - name: Protocol fuzz smoke
        env:
          ASAN_OPTIONS: halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          set -euo pipefail
          mkdir -p build/fuzz-artifacts
          for target in \
            ruvia_fuzz_http1_request \
            ruvia_fuzz_http2_connection \
            ruvia_fuzz_hpack
          do
            "build/protocol-sanitizers/tests/fuzz/$target" \
              -max_total_time=20 \
              -timeout=5 \
              -rss_limit_mb=2048 \
              -artifact_prefix=build/fuzz-artifacts/
          done

      - name: Upload fuzz findings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-fuzz-findings-${{ github.sha }}
          path: build/fuzz-artifacts
          if-no-files-found: ignore
          retention-days: 30

  ubuntu_address_sanitizer:
    name: Ubuntu ASan + UBSan
    runs-on: ubuntu-24.04
    env:
      CC: gcc-13
      CXX: g++-13
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      BUILD_TYPE: RelWithDebInfo
    steps:
      - name: Checkout ruvia
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 ninja-build curl zip unzip tar
          g++-13 --version

      - name: Cache vcpkg
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.VCPKG_ROOT }}
            ~/.cache/vcpkg/archives
            ${{ github.workspace }}/build/asan/vcpkg_installed
          key: vcpkg-asan-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'triplets/**', 'CMakeLists.txt') }}
          restore-keys: |
            vcpkg-asan-${{ runner.os }}-

      - name: Bootstrap vcpkg
        run: |
          set -euo pipefail
          if [ ! -d "$VCPKG_ROOT/.git" ]; then
            git clone --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          else
            git -C "$VCPKG_ROOT" fetch --depth 1 origin master
            git -C "$VCPKG_ROOT" reset --hard origin/master
          fi
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      # AddressSanitizer catches the memory-safety class (use-after-free,
      # heap/stack overflow, leaks) that UBSan cannot. The build auto-disables the
      # mimalloc global override once it sees -fsanitize=, so ASan owns the
      # allocation symbols cleanly. Kept to the core test executable (no fuzzers,
      # no optional DB/JWT features) so the ASan and fuzzer sanitizer flags never
      # share a configure.
      - name: Configure
        run: |
          cmake -S . -B build/asan -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DRUVIA_BUILD_TESTS=ON \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build/asan --config "$BUILD_TYPE"

      - name: Test (unit, ASan + UBSan)
        env:
          ASAN_OPTIONS: halt_on_error=1:abort_on_error=1:detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build/asan --output-on-failure --build-config "$BUILD_TYPE"

  ubuntu_thread_sanitizer:
    name: Ubuntu TSan
    runs-on: ubuntu-24.04
    env:
      CC: gcc-13
      CXX: g++-13
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      BUILD_TYPE: RelWithDebInfo
    steps:
      - name: Checkout ruvia
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 ninja-build curl zip unzip tar
          g++-13 --version

      - name: Cache vcpkg
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.VCPKG_ROOT }}
            ~/.cache/vcpkg/archives
            ${{ github.workspace }}/build/tsan/vcpkg_installed
          key: vcpkg-tsan-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'triplets/**', 'CMakeLists.txt') }}
          restore-keys: |
            vcpkg-tsan-${{ runner.os }}-

      - name: Bootstrap vcpkg
        run: |
          set -euo pipefail
          if [ ! -d "$VCPKG_ROOT/.git" ]; then
            git clone --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          else
            git -C "$VCPKG_ROOT" fetch --depth 1 origin master
            git -C "$VCPKG_ROOT" reset --hard origin/master
          fi
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      # ThreadSanitizer catches data races and deadlocks, the class that matters
      # most for the multi-worker runtime and neither UBSan nor ASan detects. The
      # full web build is kept on (default) so the multi-worker tests -- web
      # worker mailboxes, event-loop pool, server shutdown drain -- actually spawn
      # worker threads for TSan to observe. mimalloc's override auto-disables under
      # the sanitizer flag as with the other jobs.
      - name: Configure
        run: |
          cmake -S . -B build/tsan -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-sanitize-recover=all -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread" \
            -DRUVIA_BUILD_TESTS=ON \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build/tsan --config "$BUILD_TYPE"

      - name: Test (unit, TSan)
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ctest --test-dir build/tsan --output-on-failure --build-config "$BUILD_TYPE"

  windows_build:
    name: Windows build
    runs-on: windows-2025-vs2026
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      BUILD_TYPE: Debug

    steps:
      - name: Checkout ruvia
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Cache vcpkg
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.VCPKG_ROOT }}
            ${{ github.workspace }}\build\test\vcpkg_installed
          key: vcpkg-build-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'triplets/**', 'CMakeLists.txt') }}
          restore-keys: |
            vcpkg-build-${{ runner.os }}-

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "$env:VCPKG_ROOT\.git")) {
            git clone --depth 1 https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
          } else {
            git -C "$env:VCPKG_ROOT" fetch --depth 1 origin master
            git -C "$env:VCPKG_ROOT" reset --hard origin/master
          }
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build/test `
            -DCMAKE_BUILD_TYPE="$env:BUILD_TYPE" `
            -DRUVIA_ENABLE_MARIADB=ON `
            -DRUVIA_ENABLE_REDIS=ON `
            -DRUVIA_ENABLE_JWT=ON `
            -DRUVIA_BUILD_EXAMPLES=ON `
            -DRUVIA_BUILD_TESTS=ON `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake"

      - name: Build
        shell: pwsh
        run: cmake --build build/test --config "$env:BUILD_TYPE"

      - name: Test
        shell: pwsh
        run: ctest --test-dir build/test --output-on-failure --build-config "$env:BUILD_TYPE"
