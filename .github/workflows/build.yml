name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "ruvia-core/**"
      - "ruvia-http/**"
      - "ruvia-web/**"
      - "examples/**"
      - "tests/**"
      - "README.md"
      - "AGENTS.md"
      - "STYLE.md"
      - ".clang-format"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "ruvia-core/**"
      - "ruvia-http/**"
      - "ruvia-web/**"
      - "examples/**"
      - "tests/**"
      - "README.md"
      - "AGENTS.md"
      - "STYLE.md"
      - ".clang-format"
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  style:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install clang-format 21
        run: |
          python3 -m pip install --user clang-format==21.1.2
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check formatting
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.h' '*.hpp' '*.inl' '*.cpp')
          printf '%s\0' "${files[@]}" | xargs -0 -n 80 clang-format --dry-run --Werror

  linux_build:
    name: Linux
    runs-on: ubuntu-24.04
    env:
      CC: gcc-13
      CXX: g++-13
      BUILD_TYPE: Debug
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ruvia
          POSTGRES_PASSWORD: ruvia
          POSTGRES_DB: ruvia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ruvia -d ruvia"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mariadb:
        image: mariadb:11
        env:
          MARIADB_USER: ruvia
          MARIADB_PASSWORD: ruvia
          MARIADB_DATABASE: ruvia
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build perl bison flex pkg-config
          python3 -m pip install --user meson
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Restore dependency builds
        uses: actions/cache@v6
        with:
          path: build/test/_deps
          key: fetchcontent-${{ runner.os }}-${{ runner.arch }}-gcc13-${{ hashFiles('cmake/Ruvia*Dependencies.cmake', 'cmake/RuviaNativeBuild.cmake') }}
      - name: Configure
        run: |
          cmake -S . -B build/test -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -DRUVIA_ENABLE_MARIADB=ON -DRUVIA_ENABLE_POSTGRESQL=ON \
            -DRUVIA_ENABLE_REDIS=ON -DRUVIA_ENABLE_JWT=ON \
            -DRUVIA_BUILD_EXAMPLES=ON -DRUVIA_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build/test --config "$BUILD_TYPE" -j$(nproc)
      - name: Test
        env:
          RUVIA_RUN_POSTGRESQL_INTEGRATION: 1
          RUVIA_TEST_PG_PORT: 5432
          RUVIA_RUN_MARIADB_INTEGRATION: 1
        run: ctest --test-dir build/test --output-on-failure --build-config "$BUILD_TYPE"

  windows_build:
    name: Windows
    runs-on: windows-2025
    env:
      BUILD_TYPE: Debug
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install build tools
        shell: pwsh
        run: |
          choco install strawberryperl winflexbison3 jom pkgconfiglite --yes --no-progress
          python -m pip install meson
          "C:\Strawberry\perl\bin" >> $env:GITHUB_PATH
      - name: Restore dependency builds
        uses: actions/cache@v6
        with:
          path: build/test/_deps
          key: fetchcontent-${{ runner.os }}-${{ runner.arch }}-msvc-${{ hashFiles('cmake/Ruvia*Dependencies.cmake', 'cmake/RuviaNativeBuild.cmake') }}
      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build/test `
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON `
            -DRUVIA_ENABLE_MARIADB=ON -DRUVIA_ENABLE_POSTGRESQL=ON `
            -DRUVIA_ENABLE_REDIS=ON -DRUVIA_ENABLE_JWT=ON `
            -DRUVIA_BUILD_EXAMPLES=ON -DRUVIA_BUILD_TESTS=ON
      - name: Build
        shell: pwsh
        run: |
          function nproc { [Environment]::ProcessorCount }
          cmake --build build/test --config $env:BUILD_TYPE "-j$(nproc)"
      - name: Test
        shell: pwsh
        run: ctest --test-dir build/test -C $env:BUILD_TYPE --output-on-failure
