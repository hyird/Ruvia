name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "vcpkg.json"
      - "cmake/**"
      - "ruvia-core/**"
      - "ruvia-http/**"
      - "ruvia-web/**"
      - "examples/**"
      - "tests/**"
      - "scripts/**"
      - "README.md"
      - "AGENTS.md"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "vcpkg.json"
      - "cmake/**"
      - "ruvia-core/**"
      - "ruvia-http/**"
      - "ruvia-web/**"
      - "examples/**"
      - "tests/**"
      - "scripts/**"
      - "README.md"
      - "AGENTS.md"
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

# The primary platform jobs exercise the complete feature set. Linux also runs
# live database drivers, component-only configurations, sanitizers, and a
# Release build so those contracts cannot silently become opt-in.
jobs:
  linux_build:
    name: Linux
    runs-on: ubuntu-24.04
    env:
      CC: gcc-13
      CXX: g++-13
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg/archives
      VCPKG_COMMIT: 4bca8fd8654e5ba76f92661db7bfe954768ad8ef
      BUILD_TYPE: Debug
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ruvia
          POSTGRES_PASSWORD: ruvia
          POSTGRES_DB: ruvia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ruvia -d ruvia"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mariadb:
        image: mariadb:11
        env:
          MARIADB_USER: ruvia
          MARIADB_PASSWORD: ruvia
          MARIADB_DATABASE: ruvia
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout ruvia
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install toolchain
        run: |
          set -euo pipefail
          # GCC 13 and Ninja ship with the image; only the tools vcpkg needs to
          # fetch and unpack its ports have to be installed.
          sudo apt-get update
          sudo apt-get install -y ninja-build curl zip unzip tar
          gcc-13 --version
          g++-13 --version

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-binaries-${{ runner.os }}-${{ runner.arch }}-gcc13-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'triplets/**', 'CMakeLists.txt') }}
          restore-keys: |
            vcpkg-binaries-${{ runner.os }}-${{ runner.arch }}-gcc13-${{ env.VCPKG_COMMIT }}-

      - name: Bootstrap vcpkg
        run: |
          set -euo pipefail
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          git init "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$VCPKG_ROOT" fetch --depth 1 origin "$VCPKG_COMMIT"
          git -C "$VCPKG_ROOT" checkout --detach FETCH_HEAD
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure
        run: |
          cmake -S . -B build/test -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DRUVIA_ENABLE_MARIADB=ON \
            -DRUVIA_ENABLE_POSTGRESQL=ON \
            -DRUVIA_ENABLE_REDIS=ON \
            -DRUVIA_ENABLE_JWT=ON \
            -DRUVIA_BUILD_EXAMPLES=ON \
            -DRUVIA_BUILD_TESTS=ON

      - name: Save vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build
        run: cmake --build build/test --config "$BUILD_TYPE"

      - name: Test
        env:
          RUVIA_RUN_POSTGRESQL_INTEGRATION: 1
          RUVIA_TEST_PG_PORT: 5432
          RUVIA_RUN_MARIADB_INTEGRATION: 1
        run: ctest --test-dir build/test --output-on-failure --build-config "$BUILD_TYPE"

  linux_quality:
    name: Linux / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core-only
            build_dir: core
            build_type: Debug
            options: >-
              -DRUVIA_BUILD_CORE=ON
              -DRUVIA_BUILD_HTTP=OFF
              -DRUVIA_BUILD_WEB=OFF
              -DRUVIA_BUILD_TESTS=ON
          - name: http-only
            build_dir: http
            build_type: Debug
            options: >-
              -DRUVIA_BUILD_CORE=OFF
              -DRUVIA_BUILD_HTTP=ON
              -DRUVIA_BUILD_WEB=OFF
              -DRUVIA_BUILD_TESTS=ON
          - name: asan-ubsan
            build_dir: sanitizers
            build_type: Debug
            options: >-
              -DRUVIA_BUILD_TESTS=ON
              -DCMAKE_CXX_FLAGS=-fsanitize=address,undefined\ -fno-omit-frame-pointer
              -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined
              -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address,undefined
          - name: release
            build_dir: release
            build_type: Release
            options: >-
              -DRUVIA_BUILD_TESTS=ON
    env:
      CC: gcc-13
      CXX: g++-13
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg/archives
      VCPKG_COMMIT: 4bca8fd8654e5ba76f92661db7bfe954768ad8ef
    steps:
      - name: Checkout ruvia
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build curl zip unzip tar

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-binaries-${{ runner.os }}-${{ runner.arch }}-gcc13-${{ matrix.build_dir }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'triplets/**', 'CMakeLists.txt') }}
          restore-keys: |
            vcpkg-binaries-${{ runner.os }}-${{ runner.arch }}-gcc13-${{ matrix.build_dir }}-${{ env.VCPKG_COMMIT }}-
            vcpkg-binaries-${{ runner.os }}-${{ runner.arch }}-gcc13-${{ env.VCPKG_COMMIT }}-

      - name: Bootstrap vcpkg
        run: |
          set -euo pipefail
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          git init "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$VCPKG_ROOT" fetch --depth 1 origin "$VCPKG_COMMIT"
          git -C "$VCPKG_ROOT" checkout --detach FETCH_HEAD
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure
        run: |
          cmake -S . -B "build/${{ matrix.build_dir }}" -G Ninja \
            -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}" \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -DCMAKE_CXX_COMPILER="$CXX" \
            ${{ matrix.options }}

      - name: Save vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build
        run: cmake --build "build/${{ matrix.build_dir }}"

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: >-
          ctest --test-dir "build/${{ matrix.build_dir }}"
          --output-on-failure ${{ matrix.ctest_args }}

  macos_build:
    name: macOS
    runs-on: macos-26
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg/archives
      VCPKG_COMMIT: 4bca8fd8654e5ba76f92661db7bfe954768ad8ef
      BUILD_TYPE: Debug
    steps:
      - name: Checkout ruvia
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          set -euo pipefail
          # Nothing is installed here on purpose: the image already ships
          # Xcode's Apple Clang, CMake and Ninja.
          clang --version
          clang++ --version
          cmake --version
          ninja --version

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-binaries-${{ runner.os }}-${{ runner.arch }}-appleclang-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'triplets/**', 'CMakeLists.txt') }}
          restore-keys: |
            vcpkg-binaries-${{ runner.os }}-${{ runner.arch }}-appleclang-${{ env.VCPKG_COMMIT }}-

      - name: Bootstrap vcpkg
        run: |
          set -euo pipefail
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          git init "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$VCPKG_ROOT" fetch --depth 1 origin "$VCPKG_COMMIT"
          git -C "$VCPKG_ROOT" checkout --detach FETCH_HEAD
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure
        run: |
          cmake -S . -B build/test -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -DRUVIA_ENABLE_MARIADB=ON \
            -DRUVIA_ENABLE_POSTGRESQL=ON \
            -DRUVIA_ENABLE_REDIS=ON \
            -DRUVIA_ENABLE_JWT=ON \
            -DRUVIA_BUILD_EXAMPLES=ON \
            -DRUVIA_BUILD_TESTS=ON

      - name: Save vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build
        run: cmake --build build/test --config "$BUILD_TYPE"

      - name: Test
        run: ctest --test-dir build/test --output-on-failure --build-config "$BUILD_TYPE"

  windows_build:
    name: Windows
    runs-on: windows-2025
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.cache\vcpkg\archives
      VCPKG_DEFAULT_TRIPLET: x64-windows-static
      VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
      VCPKG_COMMIT: 4bca8fd8654e5ba76f92661db7bfe954768ad8ef
      BUILD_TYPE: Debug
    steps:
      - name: Checkout ruvia
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-binaries-${{ runner.os }}-${{ runner.arch }}-msvc-x64-windows-static-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'triplets/**', 'CMakeLists.txt') }}
          restore-keys: |
            vcpkg-binaries-${{ runner.os }}-${{ runner.arch }}-msvc-x64-windows-static-${{ env.VCPKG_COMMIT }}-

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          git init $env:VCPKG_ROOT
          git -C $env:VCPKG_ROOT remote add origin https://github.com/microsoft/vcpkg.git
          git -C $env:VCPKG_ROOT fetch --depth 1 origin $env:VCPKG_COMMIT
          git -C $env:VCPKG_ROOT checkout --detach FETCH_HEAD
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build/test `
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON `
            -DRUVIA_ENABLE_MARIADB=ON `
            -DRUVIA_ENABLE_POSTGRESQL=ON `
            -DRUVIA_ENABLE_REDIS=ON `
            -DRUVIA_ENABLE_JWT=ON `
            -DRUVIA_BUILD_EXAMPLES=ON `
            -DRUVIA_BUILD_TESTS=ON

      - name: Save vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build
        shell: pwsh
        run: cmake --build build/test --config $env:BUILD_TYPE --parallel

      - name: Test
        shell: pwsh
        run: ctest --test-dir build/test -C $env:BUILD_TYPE --output-on-failure

  cleanup:
    name: Prune old runs
    needs: [linux_build, linux_quality, macos_build, windows_build]
    # Run after all builds regardless of their result, but never on pull
    # requests (a fork's token is read-only and must not prune main's history).
    if: ${{ always() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Keep only the 3 most recent runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # This run is still in progress and cannot be deleted, so it is not
          # counted here: keeping the 2 newest completed runs leaves exactly 3
          # once this one finishes.
          stale=$(gh api "repos/$GH_REPO/actions/workflows/build.yml/runs?per_page=100" \
            --jq '.workflow_runs
                  | map(select(.status == "completed"))
                  | sort_by(.created_at)
                  | reverse
                  | .[2:]
                  | .[].id' || true)
          for id in $stale; do
            echo "Deleting old run $id"
            gh api --method DELETE "repos/$GH_REPO/actions/runs/$id" || true
          done
