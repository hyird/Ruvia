name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "ruvia-core/**"
      - "ruvia-http/**"
      - "ruvia-web/**"
      - "examples/**"
      - "tests/**"
      - "README.md"
      - "AGENTS.md"
      - "STYLE.md"
      - ".clang-format"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "ruvia-core/**"
      - "ruvia-http/**"
      - "ruvia-web/**"
      - "examples/**"
      - "tests/**"
      - "README.md"
      - "AGENTS.md"
      - "STYLE.md"
      - ".clang-format"
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  style:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install clang-format 21
        run: |
          python3 -m pip install --user clang-format==21.1.2
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check formatting
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.h' '*.hpp' '*.inl' '*.cpp')
          printf '%s\0' "${files[@]}" | xargs -0 -n 80 clang-format --dry-run --Werror

  linux_build:
    name: Linux
    runs-on: ubuntu-24.04
    env:
      CC: gcc-13
      CXX: g++-13
      BUILD_TYPE: Debug
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 ninja-build make perl bison flex pkg-config
          python3 -m pip install --user meson
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Restore dependency cache
        id: restore-dependency-cache
        uses: actions/cache/restore@v6
        with:
          path: build/_deps
          key: fetchcontent-${{ runner.os }}-${{ runner.arch }}-gcc13-Debug-${{ hashFiles('cmake/RuviaDependencies.cmake', 'cmake/RuviaDependencyConfigure.cmake', 'cmake/RuviaDependencyBuild.cmake') }}
          restore-keys: |
            fetchcontent-${{ runner.os }}-${{ runner.arch }}-gcc13-Debug-
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -DRUVIA_ENABLE_MARIADB=ON -DRUVIA_ENABLE_POSTGRESQL=ON \
            -DRUVIA_ENABLE_REDIS=ON -DRUVIA_ENABLE_JWT=ON \
            -DRUVIA_BUILD_EXAMPLES=ON -DRUVIA_BUILD_TESTS=ON
      - name: Build dependencies
        run: cmake --build build --config "$BUILD_TYPE" --target ruvia_dependencies -j$(nproc)
      - name: Build
        run: cmake --build build --config "$BUILD_TYPE" -j$(nproc)
      - name: Test
        run: ctest --test-dir build --output-on-failure --build-config "$BUILD_TYPE"
      - name: Save dependency cache
        if: github.ref == 'refs/heads/main' && steps.restore-dependency-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/_deps
          key: ${{ steps.restore-dependency-cache.outputs.cache-primary-key }}
  windows_build:
    name: Windows
    runs-on: windows-2025
    env:
      BUILD_TYPE: Debug
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install build tools
        shell: pwsh
        run: |
          choco install strawberryperl winflexbison3 jom pkgconfiglite --yes --no-progress
          python -m pip install meson ninja
          "C:\Strawberry\perl\bin" >> $env:GITHUB_PATH
      - name: Restore dependency cache
        id: restore-dependency-cache
        uses: actions/cache/restore@v6
        with:
          path: build/_deps
          key: fetchcontent-${{ runner.os }}-${{ runner.arch }}-msvc-Debug-${{ hashFiles('cmake/RuviaDependencies.cmake', 'cmake/RuviaDependencyConfigure.cmake', 'cmake/RuviaDependencyBuild.cmake') }}
          restore-keys: |
            fetchcontent-${{ runner.os }}-${{ runner.arch }}-msvc-Debug-
      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON `
            -DRUVIA_ENABLE_MARIADB=ON -DRUVIA_ENABLE_POSTGRESQL=ON `
            -DRUVIA_ENABLE_REDIS=ON -DRUVIA_ENABLE_JWT=ON `
            -DRUVIA_BUILD_EXAMPLES=ON -DRUVIA_BUILD_TESTS=ON
      - name: Build dependencies
        shell: pwsh
        run: cmake --build build --config $env:BUILD_TYPE --target ruvia_dependencies "-j$([Environment]::ProcessorCount)"
      - name: Build
        shell: pwsh
        run: cmake --build build --config $env:BUILD_TYPE "-j$([Environment]::ProcessorCount)"
      - name: Test
        shell: pwsh
        run: ctest --test-dir build --build-config $env:BUILD_TYPE --output-on-failure
      - name: Save dependency cache
        if: github.ref == 'refs/heads/main' && steps.restore-dependency-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/_deps
          key: ${{ steps.restore-dependency-cache.outputs.cache-primary-key }}
