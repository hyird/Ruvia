name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "vcpkg.json"
      - "ruvia-core/**"
      - "ruvia-http/**"
      - "ruvia-web/**"
      - "examples/**"
      - "tests/**"
      - "scripts/**"
      - "README.md"
      - "AGENTS.md"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "vcpkg.json"
      - "ruvia-core/**"
      - "ruvia-http/**"
      - "ruvia-web/**"
      - "examples/**"
      - "tests/**"
      - "scripts/**"
      - "README.md"
      - "AGENTS.md"
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI is deliberately just two full-feature compile-verification jobs -- Linux
# (gcc) and Windows (MSVC) -- with every optional feature enabled. Sanitizer,
# fuzz, and benchmark runs are done locally rather than on every push.
jobs:
  ubuntu_build:
    name: Ubuntu build
    runs-on: ubuntu-24.04
    env:
      CC: gcc-13
      CXX: g++-13
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      BUILD_TYPE: Debug
    steps:
      - name: Checkout ruvia
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 ninja-build curl zip unzip tar
          gcc-13 --version
          g++-13 --version

      - name: Cache vcpkg
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.VCPKG_ROOT }}
            ~/.cache/vcpkg/archives
            ${{ github.workspace }}/build/test/vcpkg_installed
          key: vcpkg-build-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'triplets/**', 'CMakeLists.txt') }}
          restore-keys: |
            vcpkg-build-${{ runner.os }}-

      - name: Bootstrap vcpkg
        run: |
          set -euo pipefail
          if [ ! -d "$VCPKG_ROOT/.git" ]; then
            git clone --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          else
            git -C "$VCPKG_ROOT" fetch --depth 1 origin master
            git -C "$VCPKG_ROOT" reset --hard origin/master
          fi
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure
        run: |
          cmake -S . -B build/test -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DRUVIA_ENABLE_MARIADB=ON \
            -DRUVIA_ENABLE_REDIS=ON \
            -DRUVIA_ENABLE_JWT=ON \
            -DRUVIA_BUILD_EXAMPLES=ON \
            -DRUVIA_BUILD_TESTS=ON \
            -DRUVIA_ENABLE_HTTP2_CONFORMANCE_TESTS=ON \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build/test --config "$BUILD_TYPE"

      - name: Test
        run: ctest --test-dir build/test --output-on-failure --build-config "$BUILD_TYPE"

  windows_build:
    name: Windows build
    runs-on: windows-2025-vs2026
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      BUILD_TYPE: Debug

    steps:
      - name: Checkout ruvia
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Cache vcpkg
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.VCPKG_ROOT }}
            ${{ github.workspace }}\build\test\vcpkg_installed
          key: vcpkg-build-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'triplets/**', 'CMakeLists.txt') }}
          restore-keys: |
            vcpkg-build-${{ runner.os }}-

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "$env:VCPKG_ROOT\.git")) {
            git clone --depth 1 https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
          } else {
            git -C "$env:VCPKG_ROOT" fetch --depth 1 origin master
            git -C "$env:VCPKG_ROOT" reset --hard origin/master
          }
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build/test `
            -DCMAKE_BUILD_TYPE="$env:BUILD_TYPE" `
            -DRUVIA_ENABLE_MARIADB=ON `
            -DRUVIA_ENABLE_REDIS=ON `
            -DRUVIA_ENABLE_JWT=ON `
            -DRUVIA_BUILD_EXAMPLES=ON `
            -DRUVIA_BUILD_TESTS=ON `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake"

      - name: Build
        shell: pwsh
        run: cmake --build build/test --config "$env:BUILD_TYPE"

      - name: Test
        shell: pwsh
        run: ctest --test-dir build/test --output-on-failure --build-config "$env:BUILD_TYPE"
