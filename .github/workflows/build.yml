name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  BUILD_TYPE: Release
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg/archives

jobs:
  style:
    name: clang-format
    needs: [resolve_toolchain, ubuntu_build, windows_build]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout Ruvia
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup mise
        if: needs.resolve_toolchain.result == 'success'
        uses: jdx/mise-action@v5.2.1
        with:
          install: false
          cache: false
      - name: Restore LLVM toolchain cache
        if: needs.resolve_toolchain.result == 'success'
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.local/share/mise/installs
          key: mise-tools-v3-${{ runner.os }}-${{ runner.arch }}-clang-cross-${{ needs.resolve_toolchain.outputs.release }}-${{ needs.resolve_toolchain.outputs.sha256 }}
          restore-keys: |
            mise-tools-v3-${{ runner.os }}-${{ runner.arch }}-clang-cross-${{ needs.resolve_toolchain.outputs.release }}-
            mise-tools-v3-${{ runner.os }}-${{ runner.arch }}-
      - name: Install resolved LLVM clang-format
        if: needs.resolve_toolchain.result == 'success'
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
          TOOLCHAIN_RELEASE: ${{ needs.resolve_toolchain.outputs.release }}
          TOOLCHAIN_SHA256: ${{ needs.resolve_toolchain.outputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$TOOLCHAIN_RELEASE" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$TOOLCHAIN_SHA256" =~ ^[[:xdigit:]]{64}$ ]]
          mise use --global "github:cross-tools/clang-cross[asset_pattern=x86_64-unknown-linux-musl.tar.xz,strip_components=0,bin_path=x86_64-unknown-linux-musl/bin,checksum=sha256:$TOOLCHAIN_SHA256]@$TOOLCHAIN_RELEASE"
          echo "$(mise where github:cross-tools/clang-cross)/x86_64-unknown-linux-musl/bin" >> "$GITHUB_PATH"
      - name: Check formatting
        if: needs.resolve_toolchain.result == 'success'
        run: |
          set -euo pipefail
          clang-format --version
          mapfile -t files < <(git ls-files '*.h' '*.hpp' '*.inl' '*.cpp')
          printf '%s\0' "${files[@]}" | xargs -0 -n 80 clang-format --dry-run --Werror

      - name: Clean old CI history
        if: ${{ always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const {data: current} = await github.rest.actions.getWorkflowRun({
              ...context.repo,
              run_id: context.runId,
            });
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo,
              workflow_id: current.workflow_id,
              per_page: 100,
            });
            const older = runs.filter(run => run.status === 'completed' &&
              run.id !== context.runId && run.run_number < current.run_number);
            let removed = 0;
            for (const run of older) {
              try {
                const {data: latest} = await github.rest.actions.getWorkflowRun({
                  ...context.repo,
                  run_id: run.id,
                });
                if (latest.status !== 'completed' || latest.run_attempt !== run.run_attempt) {
                  continue;
                }
                await github.rest.actions.deleteWorkflowRun({
                  ...context.repo,
                  run_id: run.id,
                });
                ++removed;
              } catch (error) {
                // Another finishing job may delete the run, or a rerun may make it active.
                if (error.status !== 404 && error.status !== 409) {
                  throw error;
                }
              }
            }
            core.notice(`Retained current/newer/active workflow runs; deleted ${removed} older completed runs.`);

  resolve_toolchain:
    name: Resolve latest LLVM musl toolchain and pinned vcpkg
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.resolve.outputs.release }}
      sha256: ${{ steps.resolve.outputs.sha256 }}
      vcpkg_commit: ${{ steps.resolve.outputs.vcpkg_commit }}
    steps:
      - uses: actions/checkout@v6
      - name: Resolve latest toolchain release, checksum, and vcpkg baseline
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_json="$(gh api repos/cross-tools/clang-cross/releases/latest)"
          release="$(jq -er '.tag_name' <<< "$release_json")"
          [[ "$release" =~ ^[A-Za-z0-9._-]+$ ]]
          asset=x86_64-unknown-linux-musl.tar.xz
          jq -e --arg name "$asset" '.assets | any(.name == $name)' <<< "$release_json" > /dev/null
          jq -e --arg name "$asset.sha256" '.assets | any(.name == $name)' <<< "$release_json" > /dev/null
          checksum="$(curl -fsSL "https://github.com/cross-tools/clang-cross/releases/download/$release/$asset.sha256")"
          read -r sha256 _ <<< "$checksum"
          [[ "$sha256" =~ ^[[:xdigit:]]{64}$ ]]
          vcpkg_commit="$(jq -er '."builtin-baseline"' vcpkg.json)"
          [[ "$vcpkg_commit" =~ ^[[:xdigit:]]{40}$ ]]
          printf 'release=%s\nsha256=%s\nvcpkg_commit=%s\n' "$release" "${sha256,,}" "${vcpkg_commit,,}" >> "$GITHUB_OUTPUT"

  ubuntu_build:
    name: Musl
    needs: resolve_toolchain
    runs-on: ubuntu-24.04
    env:
      VCPKG_FORCE_SYSTEM_BINARIES: '1'
      VCPKG_TARGET_TRIPLET: x64-linux-musl
      VCPKG_HOST_TRIPLET: x64-linux-musl
      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/cmake/triplets
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: pch_defines,time_macros
    steps:
      - name: Checkout Ruvia
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup musl build
        id: setup
        uses: ./.github/actions/setup-build
        with:
          toolchain-release: ${{ needs.resolve_toolchain.outputs.release }}
          toolchain-sha256: ${{ needs.resolve_toolchain.outputs.sha256 }}
          vcpkg-commit: ${{ needs.resolve_toolchain.outputs.vcpkg_commit }}
          compiler-cache: ruvia

      - name: Configure Release
        run: |
          cmake -S . -B build/ci -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION_RELEASE=ON \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DRUVIA_ENABLE_MARIADB=ON \
            -DRUVIA_ENABLE_POSTGRESQL=ON \
            -DRUVIA_ENABLE_REDIS=ON \
            -DRUVIA_ENABLE_JWT=ON \
            -DRUVIA_BUILD_EXAMPLES=ON \
            -DRUVIA_BUILD_TESTS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/cmake/llvm.cmake" \
            -DVCPKG_TARGET_TRIPLET="$VCPKG_TARGET_TRIPLET" \
            -DVCPKG_HOST_TRIPLET="$VCPKG_HOST_TRIPLET" \
            -DVCPKG_OVERLAY_TRIPLETS="$VCPKG_OVERLAY_TRIPLETS" \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Save shared vcpkg binary cache
        if: ${{ !cancelled() && steps.setup.outputs.vcpkg-cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.setup.outputs.vcpkg-cache-key }}

      - name: Build
        run: |
          ccache --zero-stats
          cmake --build build/ci --parallel "$(nproc)"
          ccache --show-stats

      - name: Test
        run: ctest --test-dir build/ci --output-on-failure --no-tests=error --build-config "$BUILD_TYPE"

      - name: Save compiler cache
        if: ${{ !cancelled() && steps.setup.outputs.compiler-cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.setup.outputs.compiler-cache-key }}

  windows_build:
    name: Windows MSVC
    needs: resolve_toolchain
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    env:
      VCPKG_TARGET_TRIPLET: x64-windows-static
      VCPKG_HOST_TRIPLET: x64-windows-static
    steps:
      - name: Checkout Ruvia
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@v5.2.1
        with:
          install: false
          cache: false

      - name: Install CMake with mise
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise use --global cmake@latest

      - name: Bootstrap vcpkg
        env:
          VCPKG_COMMIT: ${{ needs.resolve_toolchain.outputs.vcpkg_commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:VCPKG_COMMIT -notmatch '^[0-9a-f]{40}$') {
            throw 'Invalid vcpkg commit'
          }
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          "VCPKG_MAX_CONCURRENCY=$([Environment]::ProcessorCount)" >> $env:GITHUB_ENV
          git init $env:VCPKG_ROOT
          git -C $env:VCPKG_ROOT remote add origin https://github.com/microsoft/vcpkg.git
          git -C $env:VCPKG_ROOT fetch --depth 1 origin $env:VCPKG_COMMIT
          git -C $env:VCPKG_ROOT checkout --detach FETCH_HEAD
          & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-binaries-${{ runner.os }}-${{ runner.arch }}-msvc-x64-windows-static-${{ needs.resolve_toolchain.outputs.vcpkg_commit }}-${{ hashFiles('vcpkg.json', 'CMakeLists.txt', '.github/workflows/build.yml') }}
          restore-keys: |
            vcpkg-binaries-${{ runner.os }}-${{ runner.arch }}-msvc-x64-windows-static-${{ needs.resolve_toolchain.outputs.vcpkg_commit }}-
            vcpkg-binaries-${{ runner.os }}-${{ runner.arch }}-msvc-x64-windows-static-

      - name: Configure Release
        run: |
          cmake --version
          cmake -S . -B build/ci -A x64 `
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON `
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION_RELEASE=ON `
            -DRUVIA_ENABLE_MARIADB=ON -DRUVIA_ENABLE_POSTGRESQL=ON `
            -DRUVIA_ENABLE_REDIS=ON -DRUVIA_ENABLE_JWT=ON `
            -DRUVIA_BUILD_EXAMPLES=ON -DRUVIA_BUILD_TESTS=ON `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            "-DVCPKG_TARGET_TRIPLET=$env:VCPKG_TARGET_TRIPLET" `
            "-DVCPKG_HOST_TRIPLET=$env:VCPKG_HOST_TRIPLET"

      - name: Save vcpkg binary cache
        if: ${{ !cancelled() && steps.vcpkg-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build
        run: cmake --build build/ci --config $env:BUILD_TYPE "-j$([Environment]::ProcessorCount)"

      - name: Test
        run: ctest --test-dir build/ci --output-on-failure --no-tests=error --build-config $env:BUILD_TYPE
