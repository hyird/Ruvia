name: Cleanup old runs

# Keep the Actions history small: after every Build finishes, prune old workflow
# runs so only the 3 most recent completed runs of each workflow are retained.
on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: cleanup-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: Prune old runs
    runs-on: ubuntu-24.04
    steps:
      - name: Delete runs beyond the 3 most recent
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for workflow in build.yml cleanup.yml; do
            stale=$(gh api "repos/$GH_REPO/actions/workflows/$workflow/runs?per_page=100" \
              --jq '.workflow_runs
                    | map(select(.status == "completed"))
                    | sort_by(.created_at)
                    | reverse
                    | .[3:]
                    | .[].id' || true)
            for id in $stale; do
              echo "Deleting run $id of $workflow"
              gh api --method DELETE "repos/$GH_REPO/actions/runs/$id" || true
            done
          done
